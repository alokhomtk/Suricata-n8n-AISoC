networks:
  sandbox-net:
    name: n8n-sandbox-net
    driver: bridge

volumes:
  ollama_storage:
    name: ollama_storage
  sandbox_tls:
    name: sandbox_tls
  searxng_redis_data:
    name: searxng_redis_data
  vector_data:
    name: vector_data 
  postgres_data:
    name: postgres_data

services:
  # 1. Ollama Engine (Runs Qwen on CPU)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    network_mode: "host"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ollama_storage:/root/.ollama

  # 2. TLS Cert Generator (Creates precise, predictable flat file names)
  sandbox-certs-gen:
    image: n8nio/n8n-sandbox-service-api:1.2.0
    container_name: n8n-sandbox-certs-gen
    user: "0:0"
    networks:
      - sandbox-net
    volumes:
      - sandbox_tls:/tls
    entrypoint: [ "sh", "-c" ]
    command: >
      "apk add --no-cache openssl && 
       mkdir -p /tls/api /tls/runner && 
       openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /tls/api/key.pem -out /tls/api/cert.pem -subj '/CN=sandbox-api' && 
       openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /tls/runner/key.pem -out /tls/runner/cert.pem -subj '/CN=sandbox-runner' && 
       chmod -R 777 /tls"

  # 3. Privileged Docker-in-Docker Sandbox Code Execution Runner
  sandbox-runner:
    image: n8nio/n8n-sandbox-service-runner-dind:1.2.0
    container_name: n8n-sandbox-runner
    restart: unless-stopped
    privileged: true 
    networks:
      sandbox-net:
        aliases:
          - sandbox-runner
    environment:
      - SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE=n8nio/n8n-sandbox-service-execution:latest
      - SANDBOX_RUNNER_API_KEYS=secure-orange-pi-sandbox-token-9988
      - SANDBOX_RUNNER_REGISTRATION_TOKEN=<change-this-token>
      - SANDBOX_RUNNER_HTTP_BASE_URL=http://sandbox-runner:8080
      - SANDBOX_RUNNER_API_GRPC_ADDR=sandbox-api:8081
      - SANDBOX_RUNNER_API_ADDR=sandbox-api:8081
      # Registry mTLS Paths
      - SANDBOX_RUNNER_GRPC_TLS_CERT_FILE=/tls/runner/cert.pem
      - SANDBOX_RUNNER_GRPC_TLS_KEY_FILE=/tls/runner/key.pem
      - SANDBOX_RUNNER_GRPC_TLS_SERVER_CA_FILE=/tls/api/cert.pem
      # Control Plane mTLS Paths (Corrected last variable line to _CLIENT_CA_FILE)
      - SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE=/tls/runner/cert.pem
      - SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE=/tls/runner/key.pem
      - SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE=/tls/api/cert.pem  # <-- FIXED THIS LINE
      # Registration mTLS Paths
      - SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE=/tls/runner/cert.pem
      - SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE=/tls/runner/key.pem
      - SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE=/tls/api/cert.pem
    volumes:
      - sandbox_tls:/tls
    depends_on:
      sandbox-certs-gen:
        condition: service_completed_successfully


  # 4. Sandbox Control Plane Gateway
  sandbox-api:
    image: n8nio/n8n-sandbox-service-api:1.2.0
    container_name: n8n-sandbox-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - sandbox-net
    environment:
      - SANDBOX_API_KEYS=secure-orange-pi-sandbox-token-9988
      - SANDBOX_API_RUNNER_REGISTRATION_TOKEN=my-shared-registration-secret-1234
      # Registry mTLS Paths pointing to flat /runner/ directories
      - SANDBOX_API_GRPC_TLS_CERT_FILE=/tls/api/cert.pem
      - SANDBOX_API_GRPC_TLS_KEY_FILE=/tls/api/key.pem
      - SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE=/tls/runner/cert.pem
      # Control Plane mTLS Paths pointing to flat /runner/ directories
      - SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE=/tls/api/cert.pem
      - SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE=/tls/api/key.pem
      - SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE=/tls/runner/cert.pem
    volumes:
      - sandbox_tls:/tls
    depends_on:
      sandbox-runner:
        condition: service_started

  # postgres
  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    networks:
      - sandbox-net
    ports:
      - "5432:5432"  # <-- ADD THIS LINE
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n_secure_password_123
      - POSTGRES_DB=n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 5


  # 5. Primary n8n Application Engine
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-app
    restart: unless-stopped
    network_mode: "host"
    user: "1000:1000"
    environment:
      - NODE_OPTIONS=--use-system-ca
      # PostgreSQL Database Configuration
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=127.0.0.1
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n_secure_password_123 
      # AI & Webhook Settings 
      - EXECUTIONS_TIMEOUT=300
      - EXECUTIONS_TIMEOUT_MAX=300
      - N8N_INSTANCE_AI_SANDBOX_ENABLED=true
      - N8N_INSTANCE_AI_SANDBOX_PROVIDER=n8n-sandbox
      - N8N_SANDBOX_SERVICE_URL=http://sandbox-api:8080
      - N8N_SANDBOX_SERVICE_API_KEY=secure-orange-pi-sandbox-token-9988
      # Assistant Web Search Integrations (Added to fix "not set")
      - N8N_INSTANCE_AI_WEB_SEARCH_ENABLED=true
      - N8N_INSTANCE_AI_WEB_SEARCH_PROVIDER=searxng
      - N8N_INSTANCE_AI_WEB_SEARCH_URL=http://searxng:8888
      - N8N_INSTANCE_AI_MODEL=deepseek-r1:7b
      - N8N_INSTANCE_AI_MODEL_API_KEY=any-text-here-ollama-ignores-this
      - N8N_INSTANCE_AI_MODEL_URL=http://127.0.0.1:11434/v1
      - N8N_INSTANCE_AI_WEB_SEARCH_API_KEY=unused-but-required # SearXNG doesn't require a key, but n8n requires text here to validate the config
      # --- Fix the 30-Second AI/Sandbox Timeout ---
      - N8N_CONCURRENT_RESOURCE_COMPILATION_LIMIT=2
      - N8N_INSTANCE_AI_EXECUTION_TIMEOUT=300000        # Sets internal AI timeout to 120 seconds
      - EXECUTIONS_TIMEOUT=300                           # Matches your environment's baseline 
      - EXECUTIONS_TIMEOUT_MAX=300                       # Matches your environment's maximum
      - EXECUTIONS_DATA_PRUNE=true # Prevents the database from bloating with millions of logs
      - EXECUTIONS_DATA_MAX_AGE=24 # Keeps logs for only 1  days
    volumes:
      - ~/.n8n:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      sandbox-api:
        condition: service_started
      ollama:
        condition: service_started

 # 6. SearXNG Redis Cache Backend
  searxng-redis:
    image: redis:7-alpine
    container_name: searxng-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    networks:
      - sandbox-net
    volumes:
      - searxng_redis_data:/data

# 7. SearXNG Metasearch Engine
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8888:8080" # Maps physical host port 8888 to internal port 8080
    networks:
      - sandbox-net
    volumes:
      - ./searxng:/etc/searxng:ro
    depends_on:
      - searxng-redis


  vector:
    image: timberio/vector:0.40.2-debian # Lightweight and robust
    container_name: vector_suricata
    environment:
      - VECTOR_LOG=debug 
    volumes:
      # Configuration file
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      # Path to your Suricata logs
      - /var/log/suricata:/var/log/suricata:ro
      # Data directory to persist log read positions (offsets)
      - vector_data:/var/lib/vector
    # --- ADD THIS BLOCK ---
    network_mode: "host" # Shares host network seamlessly with n8n on port 5678 
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    restart: unless-stopped
    #dns:
    #  - 1.1.1.1
    #  - 8.8.8.8
